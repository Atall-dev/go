<title>…</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0f1117;color:#9299aa;font:15px system-ui,sans-serif}a{color:#7d93ff}</style>
</head><body><p id="m">…</p>
<script>
(function(){
  var h = decodeURIComponent(location.hash.slice(1)), m = document.getElementById('m');
  var r = /^([a-z0-9.]{3,40})\/([\p{L}\p{N}@._+\- ]{0,100})$/u.exec(h);
  if(!r){ m.textContent = 'Неверная ссылка'; return; }
  var u = 'cfmail://' + r[1] + '/' + encodeURIComponent(r[2]);
  location.replace(u);
  m.textContent = '';
  var a = document.createElement('a'); a.href = u; a.textContent = 'Открыть ещё раз';
  m.append('Открыто. Вкладку можно закрыть · ', a);
  history.replaceState(null, '', location.pathname);
})();
</script>
</body></html>
